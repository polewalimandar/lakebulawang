<!DOCTYPE html>
<html lang="id">
<head>

  <title>Informasi Kontak</title>
  <style>
    :root {
      --bg: #171717;
      --panel: #171717;
      --panel-hover: #171717;
      --text: #f4f7fb;
      --muted: #9aa9bd;
      --line: rgba(255,255,255,.09);
      --accent: #c99b45;
      --accent-2: #79aaff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 10%, rgba(99,215,197,.13), transparent 35%),
        radial-gradient(ellipse at 90% 90%, rgba(121,170,255,.12), transparent 35%),
        var(--bg);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    .card {
      width: min(100%, 520px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(18,29,48,.94);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    header {
      padding: 38px 28px 30px;
      text-align: center;
      background: linear-gradient(145deg, rgba(99,215,197,.10), rgba(121,170,255,.07));
      border-bottom: 1px solid var(--line);
    }
    .brand-mark {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid #c99b45;
      border-radius: 27px;
      background: linear-gradient(145deg, rgba(99,215,197,.17), rgba(121,170,255,.13));
      box-shadow: 0 10px 30px rgba(0,0,0,.18), inset 0 0 24px rgba(99,215,197,.06);
    }
    .brand-mark svg { width: 58px; height: 58px; }
    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 34px);
      letter-spacing: -.8px;
      font-weight: 750;
    }
    .intro {
      max-width: 340px;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    main { padding: 27px 26px 30px; }
    .section-title {
      margin: 0 0 15px 2px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .contact-list { display: grid; gap: 11px; }
    .contact {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: 13px 15px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .contact:hover, .contact:focus-visible {
      transform: translateY(-2px);
      border-color: #c99b45;
      background: var(--panel-hover);
      outline: none;
    }
    .icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      color: var(--accent);
      border-radius: 13px;
      background: rgba(201, 155, 69, 0.1);
    }
    .icon svg { width: 22px; height: 22px; }
    .detail { min-width: 0; }
    .label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .value {
      display: block;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
    }
    .arrow { margin-left: auto; color: #6f819a; font-size: 23px; }
    .hint {
      margin: 19px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
    footer {
      padding: 17px 20px;
      color: #718198;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
    }
    @media (max-width: 390px) {
      header { padding: 30px 18px 25px; }
      main { padding: 22px 17px 25px; }
      .contact { padding: 11px; gap: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
